<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Entrollment Form</title>
    <style>
        body{background-color: blanchedalmond;margin-left: 3%;}
        label{padding:4px;font-size: 20px ;font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; }
        h2{font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;padding: 7px;margin-left: -15px;}  
        #interest{width: 166px;}
        #age{width: 161px;}
        #month{width: 161px;height: 20px;}
        #certificate{width: 167px;}
        #reset{width: 165px;height: 28px;color: #403593;}
        #submit{width: 165px;height: 35px;background-color: brown;color: antiquewhite;}

        #submit:hover{background-color: darksalmon;}
        #submit:focus{background-color: darkolivegreen;}
        #submit:active{background-color: indianred;}

        #reset:hover{background-color: cornflowerblue;}
        #reset:focus{background-color: lavenderblush;}
        
        
    </style>
</head>

<body>

    <h2>Studenst Entrollment Sheet </h2>
    <form>

        <label for="fname">Fisrt Name</label><br>
        <input type="text" name="Full Name"><br><br>

        <label for="lname">Last Name</label><br>
        <input type="text" name="LastName" id="lname"><br><br>

        <label for="Age">Age</label><br> 
        <input type="number" min="18" max="30" name="age" id="age"><br><br>

        <label for="mail">Email</label><br>
        <input type="email" name="email" id="Email"><br><br>

        <label for="Pnumber">Phone Number</label><br>
        <input type="tel"><br><br>

        <label for="address">Adress</label><br>
        <input type="text" name="address"><br><br>

        <label for="StudentId">Student Id</label><br>
        <input type="tel" name="Number" id=""><br><br>

        <label for="password">Password</label><br>
        <input type="password" name="" id=""><br><br>

        <label for="Qualification">Qualification</label><br>
        <input type="text" name="" id=""><br><br>

        <label for="certificate">Certificate</label><br>
        <input type="file" name="" id="certificate"><br><br>

        <label for="interestlevel">Interest</label><br>
        <input type="range" name="interest" id="interest"><br><br>

        <label for="jmonth">Joining Month</label><br>
        <input type="month" id="month"><br><br><br>

        <input type="reset" id="reset"><br><br><br>

        <input type="submit" id="submit">
        

    </form>
</body>
</html>
